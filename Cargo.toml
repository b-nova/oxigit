[workspace]
resolver = "2"
members = [
    "crates/oxigit-core",
    "crates/oxigit-app",
    "crates/oxigit-server",
    "crates/oxigit-ssh",
    "crates/oxigit-e2e",
]

[workspace.package]
version = "0.1.0"
authors = ["b-nova <licensing@b-nova.com>"]
description = "The AI-native Git platform for vibecoders"
homepage = "https://oxigit.com"
repository = "https://github.com/b-nova/oxigit"
license = "BUSL-1.1"

[workspace.dependencies]
# Leptos
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos_axum = "0.8"

# Web framework
axum = "0.8"
tokio = { version = "1.51", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# SSH
russh = "0.50"
russh-keys = "0.50.0-beta.7"
ssh-key = { version = "0.6", features = ["std"] }

# Auth
argon2 = { version = "0.5", features = ["rand"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# Config
clap = { version = "4", features = ["derive", "env"] }

# WASM
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[[workspace.metadata.leptos]]
name = "oxigit"
bin-target = "oxigit-server"
output-name = "oxigit"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:9100"
reload-port = 9101
end2end-cmd = "echo 'no e2e tests yet'"
end2end-dir = "."
browserquery = "defaults"
lib-cargo-args = []
bin-cargo-args = []

# Leptos lib crate (compiled to WASM)
lib-package = "oxigit-app"
lib-default-features = false
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"

# Leptos bin crate (server binary)
bin-package = "oxigit-server"
bin-default-features = false
bin-features = ["ssr"]
bin-profile-release = "server-release"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1

[profile.server-release]
inherits = "release"

# For AI features, run Ollama separately: docker run -p 11434:11434 ollama/ollama
services:
  oxigit:
    image: ghcr.io/b-nova/oxigit:main
    ports:
      - "${OXIGIT_HTTP_PORT:-9100}:9100"
      - "${OXIGIT_SSH_PORT:-9102}:9102"
    volumes:
      - oxigit-data:/app/data
    env_file:
      - .env
    environment:
      - OXIGIT_HTTP_ADDR=0.0.0.0:9100
      - OXIGIT_SSH_ADDR=0.0.0.0:9102

volumes:
  oxigit-data:

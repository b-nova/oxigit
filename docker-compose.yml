services:
  oxigit:
    image: ghcr.io/b-nova/oxigit:main
    ports:
      - "9100:9100"
      - "2222:2222"
    volumes:
      - oxigit-data:/app/data
    environment:
      - RUST_LOG=info
      # Self-hosted: uses local Ollama sidecar by default (no API key needed)
      - OXIGIT_LLM_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama

volumes:
  oxigit-data:
  ollama-data:

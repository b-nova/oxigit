[package]
name = "oxigit-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oxigit-server"
path = "src/main.rs"

[dependencies]
oxigit-core = { path = "../oxigit-core" }
oxigit-app = { path = "../oxigit-app", features = ["ssr"] }
oxigit-ssh = { path = "../oxigit-ssh" }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true }

sqlx = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
rand_core = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }

[features]
default = ["ssr"]
ssr = []

[workspace]
resolver = "2"
members = [
    "crates/oxigit-core",
    "crates/oxigit-app",
    "crates/oxigit-server",
    "crates/oxigit-ssh",
]

[workspace.dependencies]
# Leptos
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos_axum = "0.8"

# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Git
gix = { version = "0.72", default-features = false, features = ["basic", "index"] }

# SSH
russh = "0.48"
russh-keys = "0.48"

# Auth
argon2 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

# Config
clap = { version = "4", features = ["derive", "env"] }

# WASM
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[workspace.metadata.leptos]
output-name = "oxigit"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "echo 'no e2e tests yet'"
end2end-dir = "."
browserquery = "defaults"
lib-cargo-args = ""
bin-cargo-args = ""

# Leptos lib crate (compiled to WASM)
lib-name = "oxigit_app"
lib-default-features = false
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"

# Leptos bin crate (server binary)
bin-name = "oxigit-server"
bin-default-features = false
bin-features = ["ssr"]
bin-profile-release = "server-release"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1

[profile.server-release]
inherits = "release"
